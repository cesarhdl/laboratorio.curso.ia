# Revisión automática de PR (taller U7): Claude revisa cada PR con las reglas de REVIEW.md leídas desde main.
# Basado en el ejemplo oficial de revisión de PR (code.claude.com/docs/en/github-actions).
# Usa el secreto CLAUDE_CODE_OAUTH_TOKEN de la U6. El token NUNCA va en este archivo ni en ningún otro.
# Regla del curso: la IA comenta; una persona decide y hace merge con el CI en verde.
name: Claude Review

on:
  pull_request:
    # Cuida la cuota: al abrir, reabrir o marcar listo; no en cada push.
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'unidad-2/taller/pedidos-web/**'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Ni borradores ni PR desde forks (en un fork no hay secreto y el código es de un tercero).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read        # solo lee: no hace commits
      pull-requests: write  # para comentar en el PR
      id-token: write       # para autenticarse con la Claude GitHub App
    steps:
      # Se obtiene main, no la rama del PR: las reglas (REVIEW.md, AGENTS.md) salen de main
      # y el código del PR solo se ve como diff. Así un PR no puede aflojar las reglas que lo revisan.
      - name: Obtener main (las reglas)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Claude revisa el PR
        uses: anthropics/claude-code-action@9008224dd4f743876f528e6ba0f0d611f076a7f9 # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisa este pull request de pedidos-web.
            1. Lee las reglas en unidad-2/taller/pedidos-web/AGENTS.md y unidad-2/taller/pedidos-web/REVIEW.md.
               Este checkout es main: esas son las reglas vigentes.
            2. Mira el cambio solo con `gh pr diff` y `gh pr view`. Si implementa una historia,
               lee su spec en unidad-2/taller/pedidos-web/specs/.
            3. Deja cada hallazgo como comentario en línea, en la línea exacta, con severidad
               (Importante o Detalle), por qué y la regla o CA que lo respalda.
               Respeta el tope de detalles de REVIEW.md. No inventes hallazgos.
            4. Termina con un solo comentario de resumen en el PR (gh pr comment): cuántos hallazgos
               de cada severidad y el estado de los 3 chequeos de «Revisar siempre».
            Responde en español. Nunca edites archivos ni hagas commit.
          claude_args: >-
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write"
