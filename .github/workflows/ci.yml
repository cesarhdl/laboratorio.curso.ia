# CI de Pedidos Web (taller U6): compila y prueba en cada push a main y en cada PR hacia main.
# Que ningún cambio llegue a main sin pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: el CI solo necesita leer el código.
permissions:
  contents: read

# Si llega otro push a la misma rama o PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build y test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        # pedidos-web vive en una subcarpeta de este repo.
        working-directory: unidad-2/taller/pedidos-web
    steps:
      # Versiones fijas: cada action apunta a un commit exacto (SHA), con su versión en el comentario.
      - name: Obtener el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.404'

      - name: Restaurar paquetes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Probar
        run: dotnet test --no-build --configuration Release
